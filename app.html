<!-- app.html (Editor Protegido SocialGraf Pro) -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialGraf Pro - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col m-0 font-sans">
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-lg font-black text-blue-400">SocialGraf Pro - Editor</h1>
        <button onclick="logoutUser()" class="bg-red-900/40 border border-red-500/30 text-red-400 hover:bg-red-900/60 font-bold px-4 py-2 rounded-xl text-xs transition-colors">
            Cerrar Sesión
        </button>
    </header>
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center max-w-md">
            <h2 class="text-xl font-bold mb-2">Bienvenido al Editor</h2>
            <p class="text-slate-400 text-sm">Tu sesión se encuentra activa y protegida correctamente.</p>
        </div>
    </main>

    <!-- Protección de ruta por estado de autenticación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC33DsWm7kSIeDNhCSgUGoXQ_DgSdrfPBA",
            authDomain: "socialgraf-737fa.firebaseapp.com",
            projectId: "socialgraf-737fa",
            storageBucket: "socialgraf-737fa.firebasestorage.app",
            messagingSenderId: "228214440351",
            appId: "1:228214440351:web:4ae7de4d92c9d449a23daa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'auth.html'; // Redirigir al login si no hay sesión activa
            }
        });

        window.logoutUser = () => {
            signOut(auth).then(() => {
                window.location.href = 'auth.html';
            }).catch((error) => console.error("Error al salir", error));
        };
    </script>
</body>
</html>
